// Phase 14: a deterministic, read-only AI combat exchange evaluator.
// Use exactly the same attack/guard/shield/retaliation calculation as preview
// and the actual basic attack; no synthetic combat or hidden information.
function aiAttackScore(owner,attacker,target){
 const ex=basicAttackExchange(attacker,owner,1-owner,target);
 if(!ex)return -Infinity;
 const dealt=ex.outgoing.damage,absorbed=ex.outgoing.shield||0;
 if(target.row==='hq'){
  const life=G.players[1-owner].life;
  return (dealt>=life?10000:320)+dealt*5;
 }
 const def=target.inst,card=cardOf(def),ownCard=cardOf(attacker);
 if(!def||!card)return -Infinity;
 const dead=dealt>=def.hp;
 const counter=ex.retaliation?.damage||0;
 const ownDead=counter>=attacker.hp;
 const strength=Math.max(0,computedAttack(def));
 const destroyedValue=dead?130+Math.min(65,(card.cost||0)*6)+strength*4:0;
 const tradeRisk=ownDead?155+Math.min(80,(ownCard?.cost||0)*8):0;
 return destroyedValue + dealt*7+absorbed*2-counter*8-tradeRisk;
}
function aiChooseAttackTarget(owner,attacker,targets){
 if(!targets?.length)return null;
 // Keep legal-target order for equal evaluations; no RNG or forced hit.
 let best=null,bestScore=-Infinity;
 for(const target of targets){const score=aiAttackScore(owner,attacker,target);if(score>bestScore){bestScore=score;best=target;}}
 return best;
}
// Phase 15: deterministic, read-only tactical placement and support targeting.

function aiPlacementScore(owner,card,row,col){
 const p=G.players[owner],foe=G.players[1-owner];
 if(!p||!p[row]||p[row][col]||p.reserved?.[`${row}:${col}`])return -Infinity;
 const front=p.front,behind=p.rear,adj=[col-1,col+1].filter(i=>i>=0&&i<5).map(i=>front[i]).filter(Boolean);
 const centre=2-Math.abs(col-2);
 let score=centre*1.5;
 if(row==='front'){
   score+=adj.length*3;
   if(card.name==='창병')score+=adj.length?9:0;
   if(card.name==='검병'&&adj.some(x=>cardOf(x)?.faction==='마로롱 기본덱'))score+=8;
   if(card.name==='하이에나 사냥꾼'&&adj.some(x=>cardOf(x)?.faction==='야수인 군락'))score+=8;
   if(card.name==='방패병'||card.name==='성물 호위병'||card.name==='마도 호위병'){
     score+=(behind[col]&&isUnit(cardOf(behind[col])))?15:0;
     score+=adj.length*4;
   }
   if(behind[col]&&isUnit(cardOf(behind[col])))score+=4;
   if(foe.front[col])score+=2;
 }else if(row==='rear'){
   const guard=front[col],guardName=guard&&cardOf(guard)?.name;
   if(guard)score+=5;
   if(['방패병','성물 호위병','마도 호위병'].includes(guardName))score+=14;
   if(card.name==='치유사'||card.name==='대성당 치유사'||card.name==='소생 사제')score+=guard?2:0;
 }else if(row==='terrace'){
   if(front[col])score+=4;
   if(behind[col])score+=3;
 }
 return score;
}
function aiDeploymentPriority(owner,card,row){

 let priority=card.cost*4;
 if(row==='front')priority+=frontCount===0?23:frontCount===1?12:4;
 if(row==='rear')priority+=frontCount>0?8:rearCount===0?5:0;
 if(row==='terrace')priority+=p.turns<=3?9:2;
 if(card.name==='병영'&&frontCount<4)priority+=9;
 if(card.name==='사냥꾼 야영지'&&frontCount<4)priority+=9;

function aiChooseDeployment(owner,excluded=new Set(),spendable=G.players[owner]?.mana||0){

     const location=aiPlacementScore(owner,card,row,col);
     if(!Number.isFinite(location))continue;

function aiChooseEffectTarget(owner,kind,n,targets){

   if(!z){if(bestScore===-Infinity){best=z;bestScore=0;}continue;}

   const c=cardOf(inst),missing=Math.max(0,maxHP(inst)-inst.hp);

   else if(kind==='damage')score=(inst.hp<=(n||1)?65:0)+Math.min(inst.hp,n||1)*8+(c?.cost||0)*2;

   if(score>bestScore){bestScore=score;best=z;}
 }

function ko10PirateLanding(owner,shipId,unitId,col,handId=null){const p=G.players[owner],ship=findById(owner,shipId)?.inst;
