name: Marorong Card War Phase53 Validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vendor pinned Three.js locally
        run: |
          npm install --no-audit --no-fund
          npm run vendor
      - name: Build phase 53
        run: python build.py
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Check byte-identical game engine
        run: python tests/static_audit.py
      - name: Chromium game and fallback tests
        run: |
          python tests/parity_smoke.py
          python tests/browser_smoke.py
          python tests/placement_smoke.py
      - name: Hand interaction and enemy-back visual regression
        run: python tests/hand_visual_e2e.py
      - name: Strict real WebGL rendering test
        run: python tests/webgl_e2e.py
      - name: Real perspective cinematic browser regression
        run: python tests/cinema_e2e.py
      - name: Phase53 full 3D battlefield Chromium WebGL and screenshots
        run: python tests/battlefield_e2e.py
      - name: Phase53 3D card interaction, native input and targeting Chromium QA
        run: python tests/battlefield_interaction_e2e.py
      - name: Phase53 native CSS combat events mirrored to real WebGL effects
        run: python tests/battlefield_native_fx_e2e.py
      - name: Phase53 native-confirmed combat cinematic Chromium WebGL
        run: python tests/battlefield_cinematics_e2e.py
      - name: Phase53 real turn-cycle attack Chromium WebGL QA
        run: python tests/real_combat_e2e.py
      - name: Phase53 illustrated card art and camera preset Chromium QA
        run: python tests/visual_quality_e2e.py
      - name: Phase53 3D public HP and status Chromium QA
        run: python tests/health_hud_e2e.py
      - name: Phase53 actual public-card magnifier Chromium QA
        run: python tests/card_magnifier_e2e.py
      - name: Collect downloadable build
        run: |
          mkdir -p dist
          cp Marorong_Card_War_Phase53_3D_Prototype.html dist/index.html
          mkdir -p dist/vendor
          cp vendor/three.module.js dist/vendor/three.module.js
          cp build-manifest.json dist/build-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phase53-Browser-Screenshots
          path: tests/*png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Marorong-Card-War-Phase53-3D
          path: dist/
          if-no-files-found: error
