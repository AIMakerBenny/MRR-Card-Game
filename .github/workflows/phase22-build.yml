name: Marorong Card War Phase40 Validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vendor pinned Three.js locally
        run: |
          npm install --no-audit --no-fund
          npm run vendor
      - name: Build phase 40
        run: python build.py
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Check byte-identical game engine
        run: python tests/static_audit.py
      - name: Chromium game and fallback tests
        run: |
          python tests/parity_smoke.py
          python tests/browser_smoke.py
          python tests/placement_smoke.py
      - name: Hand interaction and enemy-back visual regression
        run: python tests/hand_visual_e2e.py
      - name: Strict real WebGL rendering test
        run: python tests/webgl_e2e.py
      - name: Real perspective cinematic browser regression
        run: python tests/cinema_e2e.py
      - name: Collect downloadable build
        run: |
          mkdir -p dist
          cp Marorong_Card_War_Phase40_3D_Prototype.html dist/index.html
          mkdir -p dist/vendor
          cp vendor/three.module.js dist/vendor/three.module.js
          cp build-manifest.json dist/build-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phase40-Browser-Screenshots
          path: tests/*png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Marorong-Card-War-Phase40-3D
          path: dist/
          if-no-files-found: error
